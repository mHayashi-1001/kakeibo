<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>モック: 予算設定(/budget)</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
    --text: #0f172a; --muted: #64748b; --indigo: #4f46e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    border-bottom: 1px solid var(--border); background: rgba(255,255,255,.9);
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    max-width: 768px; margin: 0 auto;
  }
  .brand { font-weight: 700; color: var(--indigo); text-decoration: none; }
  nav a { margin-left: 16px; color: var(--muted); text-decoration: none; font-size: 14px; }
  nav a.active { color: var(--indigo); font-weight: 600; }
  main { max-width: 768px; margin: 0 auto; padding: 32px 16px; }
  .card {
    max-width: 420px; margin: 0 auto; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 24px;
  }
  h1 { font-size: 20px; text-align: center; margin: 0 0 8px; }
  .desc { font-size: 13px; color: var(--muted); text-align: center; margin: 0 0 20px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .category { width: 72px; flex-shrink: 0; font-size: 14px; color: #334155; }
  .input {
    flex: 1; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 8px; font-size: 14px;
  }
  .save-btn {
    background: var(--indigo); color: #fff; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
  }
  .msg { font-size: 12px; color: var(--muted); margin: 2px 0 12px 80px; }
  .note { max-width: 420px; margin: 16px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <a class="brand" href="#">家計簿</a>
    <nav>
      <a href="#">入力</a>
      <a href="#">一覧</a>
      <a class="active" href="#">予算</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <h1>予算設定</h1>
      <p class="desc">カテゴリごとに毎月の予算額を設定できます。空欄で保存すると未設定に戻ります。</p>

      <div class="row">
        <span class="category">食費</span>
        <input class="input" type="text" value="40000">
        <button class="save-btn">保存</button>
      </div>
      <div class="msg">保存しました</div>

      <div class="row">
        <span class="category">日用品</span>
        <input class="input" type="text" placeholder="未設定">
        <button class="save-btn">保存</button>
      </div>
      <div class="msg">&nbsp;</div>

      <div class="row">
        <span class="category">交通費</span>
        <input class="input" type="text" value="8000">
        <button class="save-btn">保存</button>
      </div>
      <div class="msg">&nbsp;</div>

      <div class="row">
        <span class="category">交際費</span>
        <input class="input" type="text" placeholder="未設定">
        <button class="save-btn">保存</button>
      </div>
      <div class="msg">&nbsp;</div>

      <p style="text-align:center; color:#94a3b8; font-size:12px;">(以下、支出カテゴリ12種分続く)</p>
    </div>
    <p class="note">※ これはdocs/design/budget.mdの画面レイアウトを再現した静的モックで、実際の操作(保存・API通信)はできません。</p>
  </main>
</body>
</html>
